name: Pratinjau build dashboard (sementara)

on:
  push:
    branches: [ci/pratinjau-dashboard]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Simpan hasil build ke branch pratinjau
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ci/pratinjau-dashboard-build
          git add -f public/build
          git commit -m "Build pratinjau ${GITHUB_SHA::7}"
          git push -f origin ci/pratinjau-dashboard-build
